network:
  host: 0.0.0.0
  port: 5000
  disable_auth: true
  disable_fetch_requests: true
  send_tracebacks: false
  api_servers: ["OAI"]
  sse_ping_interval: 15

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false
  log_chat_completion_requests: false

model:
  model_dir: /workspace/models
  inline_model_loading: false
  use_dummy_models: false
  model_name: Qwen3.8-27B-EXL3-SC6bpw-H6-V6
  backend: exllamav3
  max_seq_len: 262144
  cache_size: 1052672
  cache_mode: Q8
  tensor_parallel: false
  gpu_split_auto: true
  autosplit_reserve: [512]
  chunk_size: 2048
  output_chunking: true
  max_batch_size: 8
  vision: true
  vision_offload: false
  reasoning: true
  start_in_reasoning: always
  reasoning_start_token: " thinking"
  reasoning_end_token: "</think>"
  template_vars_default:
    enable_thinking: true
  tool_format: qwen3_coder

draft_model:
  draft_mode: mtp

sampling:
  override_preset:

memory:
  sysmem_recurrent_cache: 4096
  sysmem_kv_cache: 0
  cuda_malloc_async: true
