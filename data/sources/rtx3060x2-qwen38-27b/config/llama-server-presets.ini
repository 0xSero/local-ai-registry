; llama-server router presets for zver — 2× RTX 3060 12GB (CUDA0 = ASUS bus 17, CUDA1 = EVGA bus 65 + display).
; One model loaded at a time (--models-max 1); requests switch models by the "model" field.
; Every setting below was benchmarked 2026-09-29 — see ~/bench-results/bench.md before changing.
; Previous (3060 + 3060 Ti) version: zver.ini.3060ti-backup
version = 1

[*]
flash-attn = on
parallel = 1
jinja = true
spec-type = draft-mtp
spec-draft-n-max = 3

; Main coding model. Q4_K_XL (better quality than IQ4_XS) at 128k.
; 48.8 tok/s gen, ~660 tok/s prefill, tool calls pass. Recall at 104k: 3/3 with these sampling settings (2/3 greedy; greedy can think-loop).
[qwen-coder]
model = <models-dir>/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf
ctx-size = 131072
n-gpu-layers = 99
split-mode = tensor
tensor-split = 1,1
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
load-on-startup = true

; Fast / long-context model (MoE, 3B active). 88 tok/s gen, ~1,080 tok/s prefill, recall passes at 104k.
; No n-gpu-layers: auto-fit keeps a few expert weights in system RAM (all-GPU at 128k does not fit).
[qwen-fast]
model = <models-dir>/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
ctx-size = 131072
split-mode = layer
cache-type-k = q8_0
cache-type-v = q8_0
load-mode = none
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
