[project]
name = "local-ai-registry"
version = "1.0.0"
description = "The Local AI registry: the tested model for a GPU, and the exact command to run it"
requires-python = ">=3.9"
license = "MIT"
[project.urls]
Homepage = "https://local.sybilsolutions.ai"
Source = "https://github.com/0xSero/local-ai-registry/tree/main/sdk/python"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
py-modules = ["local_ai_registry"]
